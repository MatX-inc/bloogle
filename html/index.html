<!DOCTYPE HTML>
<html>
    <head profile="http://a9.com/-/spec/opensearch/1.1/">
        <meta http-equiv="Content-Type" content="text/html; charset=utf8" />
        <title>#{title}</title>
        <meta name="robots" content="#{robots}" />
        <link type="text/css" rel="stylesheet" href="hoogle.css" />
        <link type="image/png" rel="icon" href="favicon.png" />
        <link type="image/png" rel="apple-touch-icon" href="favicon57.png" />
        <link type="application/opensearchdescription+xml" rel="search" href="search.xml" title="Bloogle" />
        <script type="text/javascript" src="hoogle.js"> </script>
    </head>
    <body>
<div id="links">
    <ul id="top-menu">
        <li id="plugin"><a>Search plugin</a></li>
        <li><a href="https://github.com/B-Lang-org/bsc/blob/main/README.md">Manual</a></li>
        <li><a href="https://bluespec.dev">bluespec.dev</a></li>
    </ul>
</div>
<form action="" method="get" id="search">
    <a id="logo" href="#{home}"><span class="logo-text">Bloogle</span></a>
    <input name="bloogle" id="bloogle" type="text" autocomplete="off" autofocus="autofocus" accesskey="1" placeholder="Search for..." value="#{search}" />
    <select name="scope" id="scope">#{tags}</select>
    <input id="submit" type="submit" value="Search" />
</form>
<div id="body">
#{body}
        </div>
        <div id="footer">Bloogle &mdash; Bluespec API search, built on <a href="https://github.com/ndmitchell/hoogle">Hoogle</a> by <a href="http://ndmitchell.com">Neil Mitchell</a>, version #{version}</div>
    </body>
</html>
