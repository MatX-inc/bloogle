name: ci
on:
  push:
  pull_request:
  schedule:
  - cron:  '0 3 * * 6' # 3am Saturday

concurrency:
  # When changes to a PR trigger a new run, cancel in-progress runs for that PR;
  # but pushes should not cancel workflows from previous pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ['9.8', '9.6', '9.4']
        include:
        - os: windows-latest
          ghc: 9.12
        - os: macOS-latest
          ghc: 9.12

    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - uses: haskell-actions/setup@v2
      id: setup-haskell
      with:
        ghc-version: ${{ matrix.ghc }}
    - run: cabal freeze
    - uses: actions/cache@v5
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
        restore-keys: ${{ runner.os }}-${{ matrix.ghc }}-
    - run: cabal build all
    - run: cabal run bloogle -- test

  # ------------------------------
  # Nix flake: `nix flake check` builds the package via the flake and runs
  # the test suite from it. The flake pins its own nixpkgs snapshot, so this
  # catches drift the cabal jobs cannot: a bloogle.cabal change the pinned
  # package set cannot satisfy, or a broken/removed ghc967 set after a
  # `nix flake update`.

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - run: nix flake check -L

  # ------------------------------
  # Binary builds for every commit

  binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-15 ]
    name: "Binary: ${{ matrix.os }}"
    uses: ./.github/workflows/build-binary.yml
    with:
      os: ${{ matrix.os }}
