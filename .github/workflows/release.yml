name: release

# Build binaries and publish a GitHub release whenever a version tag
# (e.g. v5.0.19.0) is pushed. Tags with a hyphenated suffix
# (e.g. v5.0.20.0-rc1) are published as prereleases.

on:
  push:
    tags: [ 'v*' ]

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-15 ]
    name: "Binary: ${{ matrix.os }}"
    uses: ./.github/workflows/build-binary.yml
    with:
      os: ${{ matrix.os }}

  release:
    name: "Release: ${{ github.ref_name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: binaries
    permissions:
      contents: write
    steps:
    - name: Download binaries
      uses: actions/download-artifact@v8
      with:
        pattern: bloogle-*
        merge-multiple: true
        path: dist
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$GITHUB_REF_NAME" in
          *-*) prerelease=--prerelease ;;
          *)   prerelease= ;;
        esac
        gh release create "$GITHUB_REF_NAME" $prerelease \
          --repo "$GITHUB_REPOSITORY" \
          --verify-tag \
          --title "Bloogle $GITHUB_REF_NAME" \
          --generate-notes \
          dist/*
