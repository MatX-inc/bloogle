name: Build Binary

# This file defines a workflow parameterized by OS that builds the bloogle
# executable, uploads it as a tarball artifact, and smoke tests that artifact
# on a separate toolchain-free runner. It is called from the ci and release
# workflows; a failing smoketest blocks the release.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  build:
    name: "Binary: ${{ inputs.os }}"
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev zlib1g-dev pkg-config
    - uses: haskell-actions/setup@v2
      id: setup-haskell
      with:
        # A reliable and stable version of GHC
        # (the same one bsc pins for its release builds)
        ghc-version: 9.6.7
    - run: cabal freeze
    # Include the os (not just runner.os) in the cache key, so that
    # different architectures and OS versions don't share caches.
    - uses: actions/cache@v5
      with:
        path: |
          ${{ steps.setup-haskell.outputs.cabal-store }}
          dist-newstyle
        key: binaries-${{ inputs.os }}-${{ hashFiles('cabal.project.freeze') }}
        restore-keys: binaries-${{ inputs.os }}-
    - name: Build
      run: cabal install exe:bloogle --install-method=copy --installdir=bin
    - name: Smoketest
      run: bin/bloogle --version
    # Tar the binary before upload, because the artifact zip does not
    # preserve the executable permission bit:
    #   https://github.com/actions/upload-artifact/issues/38
    - name: Package
      run: tar czf bloogle-${{ inputs.os }}.tar.gz -C bin bloogle
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: bloogle-${{ inputs.os }}
        path: bloogle-${{ inputs.os }}.tar.gz

  # Exercise the packaged binary end-to-end on a fresh runner with no Haskell
  # toolchain set up and no cabal store: build a database from the sample
  # data, search it, and serve it over HTTP. The serve step runs from an
  # empty directory, so everything the server needs must come embedded in the
  # binary itself -- this is what catches a binary that only works on the
  # machine that built it. The sparse checkout materializes only the
  # misc/sample-data fixture (plus root-level files): html/ is not on the
  # runner's disk at all, so the server cannot be leaning on an on-disk copy.
  smoketest:
    name: "Smoketest: ${{ inputs.os }}"
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    needs: build

    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: misc/sample-data
        filter: blob:none
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: bloogle-${{ inputs.os }}
    - name: Unpack
      run: tar xzf bloogle-${{ inputs.os }}.tar.gz
    - name: Smoketest
      shell: bash
      run: |
        ./bloogle --version
        ./bloogle generate smoke.hoo misc/sample-data
        ./bloogle smoke.hoo Wife | grep Wife
        mkdir smoke-cwd
        cd smoke-cwd
        ../bloogle serve ../smoke.hoo --port 18080 &
        SERVER=$!
        trap 'kill $SERVER 2>/dev/null || true' EXIT
        for _ in $(seq 1 30); do
          curl -fsS -o /dev/null http://127.0.0.1:18080/ && break
          sleep 1
        done
        home=$(curl -fsS http://127.0.0.1:18080/)
        grep -F '<title>Bloogle</title>' <<<"$home"
        if grep -F '#{' <<<"$home"; then echo 'unsubstituted template variable'; exit 1; fi
        # 'type family' appears only in rendered search results, never in the
        # html templates, so this fails if search comes back empty
        curl -fsS 'http://127.0.0.1:18080/?bloogle=Wife' | grep -F 'type family'
        curl -fsS http://127.0.0.1:18080/search.xml | grep -F '<ShortName>Bloogle</ShortName>'
        curl -fsS -o /dev/null http://127.0.0.1:18080/bloogle.css
        curl -fsS -o /dev/null http://127.0.0.1:18080/spinner.gif
